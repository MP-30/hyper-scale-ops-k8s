apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "hyper-scale-ops.fullname" . }}
  labels:
    {{- include "hyper-scale-ops.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "hyper-scale-ops.selectorLabels" . | nindent 6 }}

  template:

    metadata:
      labels:
        {{- include "hyper-scale-ops.selectorLabels" . | nindent 8 }}

{{/*      annotations:*/}}

{{/*        vault.hashicorp.com/agent-inject: "true"*/}}

{{/*        vault.hashicorp.com/role: "hyper-role"*/}}

{{/*        vault.hashicorp.com/agent-inject-secret-config: "secret/data/hyper"*/}}

{{/*        vault.hashicorp.com/agent-inject-template-config: |*/}}
{{/*            {{`{{- with secret "secret/data/hyper" -}}*/}}
{{/*            DATABASE_URL={{ .Data.data.DATABASE_URL }}*/}}
{{/*            {{- end }}`}}*/}}

    spec:
      serviceAccountName: {{ include "hyper-scale-ops.fullname" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
                  {{ include "hyper-scale-ops.selectorLabels" . | nindent 14 }}
# image tag will be override by values.yaml
      containers:
        - name: hyper-scale-ops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: {{ .Values.service.targetPort }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 10

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3

{{/*          envFrom:*/}}
{{/*            - configMapRef:*/}}
{{/*                name: {{ include "hyper-scale-ops.fullname" . }}*/}}
          envFrom:
            - configMapRef:
                name: {{ include "hyper-scale-ops.fullname" . }}

            - secretRef:
                name: hyper-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}