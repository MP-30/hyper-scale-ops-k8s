# Number of pod replicas
replicaCount: 3

# Docker image configuration
image:
  repository: mp30/hyper-ops
  # tag will be override by values.yaml from environments folder
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Kubernetes Service
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ConfigMap values
config:
  APP_ENV: development
  APP_NAME: Hyper Scale Ops
  LOG_LEVEL: INFO

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: hyper.local
  path: /
  pathType: Prefix

# Resources (empty for now)
resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

# Pod labels
labels: {}

probes:
  liveness:
    initialDelaySeconds: 25
    periodSeconds: 40
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 20

# Pod annotations
annotations: {}